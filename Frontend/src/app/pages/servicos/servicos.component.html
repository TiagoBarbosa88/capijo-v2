<!-- Seção de Eventos -->
<section class="services-section spad" aria-labelledby="eventos-heading">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="section-title center-title">
          <h2 id="eventos-heading">Nossos eventos</h2>
          <p id="eventos-description">Confira alguns dos eventos e shows que realizamos</p>
        </div>
      </div>
    </div>

    <div class="row" role="list" aria-labelledby="eventos-heading" aria-describedby="eventos-description">
      <ng-container *ngFor="let event of events; let i = index">
        <div class="col-lg-4 col-md-6 mb-5" role="listitem">
          <div class="event-card">
            <div class="card-img-wrapper">
              <img [src]="event.image" class="card-img-top" [alt]="event.imageAlt" (click)="openImage(event.image)"
                role="button" tabindex="0" [attr.aria-label]="'Clique para ampliar a foto do evento ' + event.label">
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</section>

<!-- Seção Onde Atendemos -->
<section class="locations-section spad" aria-labelledby="locais-heading">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="section-title center-title">
          <h2 id="locais-heading">Onde atendemos</h2>
          <p id="locations-description">Levamos música e entretenimento de qualidade para diversos tipos de eventos e
            locais</p>
        </div>
      </div>
    </div>

    <div class="row" role="list" aria-labelledby="locais-heading" aria-describedby="locations-description">
      <ng-container *ngFor="let location of locations; let i = index">
        <div class="col-lg-4 col-md-6 mb-4" role="listitem">
          <div class="location-card">
            <div class="icon-wrapper" aria-hidden="true">
              <i [class]="location.iconClass"></i>
            </div>
            <h3 [id]="location.id + '-heading'">{{ location.title }}</h3>
            <p>{{ location.description }}</p>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</section>
